<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Emotional Reel</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      font-family: Arial, sans-serif;
      color: white;
      overflow: hidden;
    }

    .reel {
      width: 100vw;
      height: 100vh;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;

      background:
        linear-gradient(rgba(0,0,0,.45), rgba(0,0,0,.75)),
        url("background.jpg");

      background-size: cover;
      background-position: center;
    }

    .content {
      width: 90%;
      animation: fadeIn 2s ease;
    }

    .scene {
      display: none;
    }

    .scene.active {
      display: block;
    }

    .text {
      font-size: 28px;
      line-height: 1.5;
      font-weight: bold;
      text-shadow: 0 3px 10px #000;
    }

    .small {
      margin-top: 25px;
      font-size: 15px;
      opacity: .8;
    }

    .progress {
      position: absolute;
      bottom: 25px;
      left: 5%;
      width: 90%;
      height: 3px;
      background: rgba(255,255,255,.3);
    }

    .bar {
      width: 0%;
      height: 100%;
      background: white;
      animation: progress 15s linear forwards;
    }

    .instagram {
      position: absolute;
      right: 18px;
      bottom: 80px;
      font-size: 14px;
      opacity: .8;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes progress {
      from {
        width: 0%;
      }

      to {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="reel">

    <div class="content">

      <!-- Scene 1 -->
      <div class="scene active">
        <div class="text">
          कुछ लोग दूर होकर भी...<br>
          यादों में पास रहते हैं। 🖤
        </div>

        <div class="small">
          0–5 सेकंड
        </div>
      </div>

      <!-- Scene 2 -->
      <div class="scene">
        <div class="text">
          वक्त बदल जाता है,<br>
          लेकिन कुछ यादें नहीं।
        </div>

        <div class="small">
          5–10 सेकंड
        </div>
      </div>

      <!-- Scene 3 -->
      <div class="scene">
        <div class="text">
          मुस्कुराना सीख लिया...<br>
          बस इतना ही।
        </div>

        <div class="small">
          10–15 सेकंड
        </div>
      </div>

    </div>

    <div class="instagram">
      Follow for more ❤️
    </div>

    <div class="progress">
      <div class="bar"></div>
    </div>

  </div>

  <script>

    const scenes = document.querySelectorAll(".scene");

    let current = 0;

    function showScene() {

      scenes.forEach(scene => {
        scene.classList.remove("active");
      });

      scenes[current].classList.add("active");

      current++;

      if (current >= scenes.length) {
        current = 0;
      }
    }

    // हर 5 सेकंड में scene बदलेगा
    setInterval(showScene, 5000);

  </script>

</body>
</html>
